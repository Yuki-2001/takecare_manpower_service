# Application
spring.application.name=takecare-manpower-service
server.port=8080
spring.profiles.active=dev

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/takecare_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP - included with Spring Boot JPA)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Default Schema
spring.jpa.properties.hibernate.default_schema=candidate

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-login-endpoint=true
springdoc.use-fqn=true
springdoc.paths-to-match=/**
springdoc.packagesToScan=com.takecare.controller

# Hostinger SMTP Configuration
spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=noreply@takecaremanpower.in
spring.mail.password=Tambaram12345*

# SMTP Authentication
spring.mail.properties.mail.smtp.auth=true

# SSL/TLS
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Connection timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Application sender
#takecare.mail.from=${MAIL_USERNAME}

# Additional Property
app.ui.url=http://localhost:5173

